name: security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Lint
        shell: pwsh
        run: |
          $settings = 'codex-quota-keeper/PSScriptAnalyzerSettings.psd1'
          $results = Invoke-ScriptAnalyzer -Path codex-quota-keeper/scripts -Settings $settings -Recurse
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          $results | ForEach-Object { "{0} {1}:{2} {3}" -f $_.Severity, $_.ScriptName, $_.Line, $_.Message }
          if ($errors.Count -gt 0) { exit 1 }

  secret-scan:
    name: Secret scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for credential patterns
        shell: pwsh
        # CQK-033: the scan logic lives in codex-quota-keeper/tests/secret-scan.ps1
        # so it can be run locally and asserted by tests/secret-scan.test.ps1.
        # Previously the rule was an inline `Where-Object { $_.FullName -notmatch
        # '\\tests\\' }`, which silently removed ~20 test files and every golden
        # snapshot from the scan with nothing in the repo able to notice. There are
        # no path exclusions now; only four named synthetic literals used by the
        # sanitization fixtures are matched out, and the files carrying them are
        # still scanned for everything else.
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File codex-quota-keeper/tests/secret-scan.ps1
