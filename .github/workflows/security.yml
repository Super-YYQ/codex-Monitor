name: security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Lint
        shell: pwsh
        run: |
          $settings = 'codex-quota-keeper/PSScriptAnalyzerSettings.psd1'
          $results = Invoke-ScriptAnalyzer -Path codex-quota-keeper/scripts -Settings $settings -Recurse
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          $results | ForEach-Object { "{0} {1}:{2} {3}" -f $_.Severity, $_.ScriptName, $_.Line, $_.Message }
          if ($errors.Count -gt 0) { exit 1 }

  secret-scan:
    name: Secret scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for credential patterns
        shell: pwsh
        run: |
          $patterns = @(
            'sk-[A-Za-z0-9_\-]{20,}',
            'ghp_[A-Za-z0-9]{20,}',
            'gh[ousr]_[A-Za-z0-9]{20,}',
            'github_pat_[A-Za-z0-9_]{20,}',
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----',
            '(?i)(api[_-]?key|secret|password)\s*[=:]\s*[''\"][^''\"\s]{12,}'
          )
          $files = Get-ChildItem -Recurse -File |
            Where-Object { $_.FullName -notmatch '\.git\\' -and $_.Extension -notin '.docx', '.png', '.jpg' } |
            Where-Object { $_.FullName -notmatch '\\tests\\' }
          # Note: codex-quota-keeper/tests/** is excluded because it carries
          # intentionally-fake credential strings (ghp_/gho_/github_pat_ …) used by
          # the sanitization fixtures to verify redaction. Production code is still
          # fully scanned.
          $hits = @()
          foreach ($f in $files) {
            $text = [System.IO.File]::ReadAllText($f.FullName)
            foreach ($p in $patterns) {
              if ($text -match $p) { $hits += "$($f.FullName) matches $p" }
            }
          }
          $hits | ForEach-Object { Write-Host "SECRET HIT: $_" }
          if ($hits.Count -gt 0) { exit 1 }
          Write-Host 'No credential patterns found.'
